[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsf-tools"
dynamic = ["version"]
description = "File Sanitization Framework — CLI for viewing, cleaning, spoofing, and forging file metadata"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FSF Tools Contributors" }
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "mutagen>=1.47",
    "pikepdf>=8.0",
    "Pillow>=10.0",
    "python-docx>=1.0",
    "openpyxl>=3.1"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
fsf = "fsf_core.cli:main"

[project.urls]
Homepage = "https://github.com/fsf-tools/fsf-tools"

[tool.hatch.version]
path = "fsf_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fsf_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
