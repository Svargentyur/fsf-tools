[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fsf-tools"
dynamic = ["version"]
description = "File Sanitization Framework — CLI & TUI for viewing, cleaning, spoofing, forging, and auditing file metadata"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "FSF Tools Contributors" }
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "mutagen>=1.47",
    "pikepdf>=8.0",
    "Pillow>=10.0",
    "python-docx>=1.0",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "piexif>=1.1",
    "textual>=0.80"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov"
]

[project.scripts]
fsf = "fsf_core.cli:main"

[project.urls]
Homepage = "https://github.com/Svargentyur/fsf-tools"

[tool.hatch.version]
path = "fsf_core/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["fsf_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
